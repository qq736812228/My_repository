stages:
  - quality
  - build
  - package

backend-quality:
  stage: quality
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -q -DskipTests checkstyle:check

backend-build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -q clean package
  artifacts:
    paths:
      - backend/target/*.jar

admin-build:
  stage: build
  image: node:20
  script:
    - cd admin
    - npm ci
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - admin/dist

app-build:
  stage: build
  image: node:20
  script:
    - cd app
    - npm ci
    - npm run build:mp-weixin
  artifacts:
    paths:
      - app/dist
